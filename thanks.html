<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you | RafTek</title>
  <meta name="description" content="Thank you for contacting RafTek." />
  <meta name="theme-color" content="#07111f" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">RafTek</a>
      <div class="language-switcher" aria-label="Language" style="margin-left:auto">
        <button type="button" class="lang-button active" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang-button" data-lang="nl" aria-pressed="false">NL</button>
        <button type="button" class="lang-button" data-lang="tr" aria-pressed="false">TR</button>
      </div>
    </div>
  </header>

  <main class="simple-page">
    <div class="container">
      <div class="thanks-card">
        <p class="eyebrow" data-i18n="thanks.eyebrow">Enquiry received</p>
        <h1 data-i18n="thanks.title">Thank you for contacting RafTek.</h1>
        <p data-i18n="thanks.body">Your enquiry has been submitted. We will review the information you provided and respond using the contact details in your message.</p>
        <a class="button primary" href="index.html" data-i18n="thanks.back">Return to RafTek</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
